kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Gradle settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
#org.gradle.configuration-cache=true
# ZGC from JDK 21
org.gradle.jvmargs=-Xms1024m -Xmx4096m -XX:+UseZGC -XX:+ZGenerational

org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Mod Properties
mod_version=0.15
maven_group=net.ccbluex
archives_base_name=LokoAmi
# --- 追加：给 Gradle 的 HTTP 客户端加强超时 ---
# 原因：部分镜像源（如 repo.viaversion.com）会接受连接但不返回数据，
#      Gradle 默认会无限期等待，表现为"构建卡死、CPU 接近 0"。
#      加上超时后它会快速放弃该源并转下一个。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000